<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Artwork Viewer</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; }
        a-scene { height: 100vh; }
    </style>
</head>
<body>
    <a-scene embedded arjs>
        <a-marker preset="hiro">
            <a-image id="artworkImage" position="0 0 0" rotation="-90 0 0" width="1"></a-image>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Function to get query parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Get the image URL from the query parameter
        const imageUrl = getQueryParam('image');
        if (imageUrl) {
            const artworkImage = document.getElementById('artworkImage');
            artworkImage.setAttribute('src', imageUrl);
            console.log("Image URL set for AR:", imageUrl); // Log the image URL
        } else {
            console.error("No image URL provided in query parameters.");
        }
    </script>
</body>
</html>
